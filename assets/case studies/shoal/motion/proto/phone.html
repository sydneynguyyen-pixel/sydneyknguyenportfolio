<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shoal prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..400,0,1;1,9..144,300..400,0,1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="pebble.css">
<style>
/* The case study plays the prototype inside its iPhone frame (435 × 899.5, the screen at 16, 13.5).
   The frame is narrower than the prototype's own phone breakpoint, so these undo the full-screen phone look. */
html, body { background: transparent !important; overflow: hidden; }
.stage { display: block !important; padding: 0 !important; min-height: 0 !important; height: auto !important; }
.notes, .panel-toggle, .toast { display: none !important; }
/* The frame's opening is 402.5px wide with corners about 55px round, so the screen fills it edge to edge. */
.phone-wrap { position: absolute !important; left: 16px; top: 13.5px; width: 403px !important; height: 874px !important; }
.phone { width: 403px !important; height: 874px !important; border-radius: 55px !important; transform: none !important; }
.phone-frame { display: block !important; transform: none !important; filter: none !important; }
/* A tap, drawn where the script presses */
.m-tap { position: absolute; z-index: 999; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; pointer-events: none;
  background: rgba(19, 49, 93, 0.16); border: 2px solid rgba(255, 255, 255, 0.95); box-shadow: 0 2px 10px rgba(19, 49, 93, 0.18);
  animation: mTap 0.6s ease-out forwards; }
@keyframes mTap {
  0% { opacity: 0; transform: scale(0.6); }
  25% { opacity: 1; transform: scale(1); }
  45% { opacity: 1; transform: scale(0.88); }
  100% { opacity: 0; transform: scale(1.5); }
}
.m-still *, .m-still *::before, .m-still *::after { animation: none !important; transition: none !important; }
</style>
</head>
<body>
  <div class="stage">
    <aside class="notes" id="notes"></aside>
    <div class="phone-wrap" id="phoneWrap">
      <div class="phone" id="phone">
        <div class="glow" aria-hidden="true">
          <img class="glow-top" src="assets/glow-top.svg" alt="">
          <img class="glow-bottom" src="assets/glow-bottom.svg" alt="">
        </div>
        <div class="statusbar" aria-hidden="true">
          <span class="time">9:41</span>
          <img src="assets/status.svg" alt="">
        </div>
        <main id="screen" class="screen"></main>
        <div id="sheet" class="sheet-layer"></div>
        <div id="tour" class="tour-layer"></div>
        <div id="toast" class="toast" role="status"></div>
      </div>
      <img class="phone-frame" id="phoneFrame" src="assets/phone-frame.png" alt="" aria-hidden="true">
    </div>
  </div>
  <script src="app.js"></script>
  <script src="main-app.js"></script>
  <script src="start.js"></script>
  <script src="roles.js"></script>
  <script src="invite.js"></script>
  <script src="people.js"></script>
  <script src="pebble.js"></script>
  <script src="colors.js"></script>
  <script src="kit.js"></script>
  <script src="home.js"></script>
  <script src="motion.js"></script>
  <script src="cheer.js"></script>
  <script src="thanks.js"></script>
  <script src="care.js"></script>
  <script src="outside.js"></script>
  <script src="tour.js"></script>
  <script src="stones.js"></script>
  <script>
  // Skip the splash and onboarding, and land in the app, the same as the prototype's testing shortcut.
  ACTIONS.skipToApp();
  // The animation pages drive the prototype from outside, so they need its state and actions.
  Object.defineProperties(window, { S: { get: () => S }, ACTIONS: { get: () => ACTIONS } });
  window.protoReady = true;
  parent.postMessage({ shoalProto: 'ready' }, '*');
  </script>
</body>
</html>
